<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>模擬世界</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell">
      <header>
        <div>
          <p class="eyebrow">WORLD SIMULATION</p>
          <h1>模擬世界</h1>
          <p class="muted">不接 LLM 也能自行運行的資料驅動世界</p>
        </div>
        <div id="world-status" class="status">載入中</div>
      </header>

      <section class="controls">
        <button id="toggle">啟動</button>
        <button id="step">單步 +1 分鐘</button>
        <button id="reset">重新開始</button>
      </section>

      <section class="dashboard">
        <article class="card summary"><h2>世界狀態</h2><div id="summary"></div></article>
        <article class="card"><h2>世界角色</h2><div id="entities"></div></article>
        <article class="card"><h2>居民互動</h2><div id="interactions"></div><div id="interaction-box" class="interaction-box muted">選擇一名居民查看詳細資料。</div></article>
        <article class="card events"><h2>最近事件</h2><div id="events"></div></article>
      </section>
    </main>
    <script type="module" src="./app.js"></script>
  </body>
</html>
