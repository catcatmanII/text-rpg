<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111318"><title>亞丁文字冒險</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;background:#0d0f13;color:#eee;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif}button,input{font:inherit}.app{height:100dvh;max-width:680px;margin:auto;display:flex;flex-direction:column;background:#111318;overflow:hidden}.top{padding:max(12px,env(safe-area-inset-top)) 16px 12px;background:#181b21;border-bottom:1px solid #2a2e37}.title{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:19px}.soundBtn{border:1px solid #343a45;background:#242830;color:#fff;border-radius:10px;width:42px;height:36px}.place{margin-top:5px;color:#aeb4c0;font-size:13px}.hud{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;margin-top:12px;font-size:13px}.hpbar,.bar{height:8px;background:#343944;border-radius:999px;overflow:hidden}.hpfill,.enemyfill{height:100%;background:#c94f55}.hudHp{display:grid;grid-template-columns:auto 1fr auto;gap:7px;align-items:center}.story{flex:1;overflow-y:auto;padding:16px}.msg{padding:12px 13px;margin-bottom:10px;background:#191c22;border:1px solid #252a33;border-radius:12px;line-height:1.65;white-space:pre-line}.msg.player{background:#162131}.msg.combat{background:#26191b}.controls{background:#171a20;border-top:1px solid #292e37;padding:10px 12px calc(10px + env(safe-area-inset-bottom))}.actionGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.action,.combatBtn{min-height:52px;border:1px solid #343a45;border-radius:12px;background:#242830;color:#fff;font-weight:700}.free{display:flex;gap:8px;margin-top:9px}.free input{min-width:0;flex:1;height:48px;border:1px solid #353b46;border-radius:12px;background:#0f1116;color:#fff;padding:0 13px}.send{width:52px;border:0;border-radius:12px;background:#9a7b37;color:#fff}.combatPanel{display:none;flex-direction:column;gap:10px}.app.combat .explorePanel{display:none}.app.combat .combatPanel{display:flex}.enemyCard{position:relative;padding:14px;border:1px solid #4a3033;border-radius:14px;background:#211719}.enemyHead{display:flex;justify-content:space-between;margin-bottom:8px}.enemyName{font-size:18px;font-weight:800}.combatActions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.attack{grid-column:1/-1;min-height:58px;background:#853d42;border:1px solid #a9585e;color:#fff;border-radius:13px;font-weight:800}.enemyHit{animation:hit .2s}.playerHit{animation:phit .22s}.damagePop{position:absolute;right:18px;top:6px;font-size:27px;font-weight:900;animation:pop .55s forwards}@keyframes hit{25%{transform:translateX(-7px);background:#633136}55%{transform:translateX(6px)}}@keyframes phit{40%{background:#5a292d}}@keyframes pop{100%{opacity:0;transform:translateY(-28px)}}</style></head><body><div class="app" id="app"><header class="top" id="top"><div class="title"><span id="modeTitle">亞丁文字冒險</span><button id="soundBtn" class="soundBtn" onclick="toggleSound()">🔊</button></div><div class="place">📍 <span id="location"></span></div><div class="hud"><div class="hudHp"><span>❤️</span><div class="hpbar"><div class="hpfill" id="hpfill"></div></div><span id="hp"></span></div><span>Lv.<b id="level"></b> · EXP <b id="exp"></b></span><span>💰 <b id="gold"></b></span></div></header><main class="story" id="story"></main><footer class="controls"><section class="explorePanel"><div class="actionGrid"><button class="action" onclick="observe()">👁️<br>觀察</button><button class="action" onclick="showInventory()">🎒<br>背包</button><button class="action" onclick="showStatus()">👤<br>狀態</button><button class="action" onclick="moveTo('說話之島村莊')">🏘️<br>村莊</button><button class="action" onclick="moveTo('說話之島野外')">🗺️<br>野外</button><button class="action" onclick="rest()">🔥<br>休息</button></div><div class="free"><input id="command" placeholder="想做其他事情……"><button class="send" onclick="sendCommand()">➤</button></div></section><section class="combatPanel"><div class="enemyCard" id="enemyCard"><div class="enemyHead"><span class="enemyName" id="enemyName"></span><span id="enemyHp"></span></div><div class="bar"><div class="enemyfill" id="enemyfill"></div></div></div><div class="combatActions"><button class="attack" onclick="attack()">⚔️ 普通攻擊</button><button class="combatBtn" disabled>✨ 技能</button><button class="combatBtn" onclick="showInventory()">🎒 道具</button><button class="combatBtn" onclick="flee()">🏃 逃跑</button><button class="combatBtn" onclick="showStatus()">👤 狀態</button></div></section></footer></div><script>
const SAVE_VERSION=2;const LEVEL_TABLE={1:{nextExp:20,maxHp:30,baseAttack:2},2:{nextExp:50,maxHp:36,baseAttack:3},3:{nextExp:90,maxHp:42,baseAttack:4},4:{nextExp:140,maxHp:48,baseAttack:5},5:{nextExp:null,maxHp:55,baseAttack:6}};
const ITEMS={rustySword:{id:'rustySword',name:'生鏽的短劍',type:'WEAPON',attack:2,value:2},ironSword:{id:'ironSword',name:'鐵劍',type:'WEAPON',attack:5,value:25},redPotion:{id:'redPotion',name:'紅色藥水',type:'CONSUMABLE',heal:15,value:5},slimeGel:{id:'slimeGel',name:'史萊姆黏液',type:'MATERIAL',value:2},goblinTooth:{id:'goblinTooth',name:'哥布林牙齒',type:'MATERIAL',value:3},wolfPelt:{id:'wolfPelt',name:'狼皮',type:'MATERIAL',value:5}};
const MONSTERS={slime:{id:'slime',name:'史萊姆',level:1,hp:8,attack:2,exp:4,goldMin:1,goldMax:3,weight:40,lootTable:[{itemId:'slimeGel',chance:.6},{itemId:'redPotion',chance:.05}]},goblin:{id:'goblin',name:'哥布林',level:1,hp:12,attack:4,exp:7,goldMin:3,goldMax:7,weight:40,lootTable:[{itemId:'goblinTooth',chance:.45},{itemId:'redPotion',chance:.1}]},wolf:{id:'wolf',name:'野狼',level:2,hp:18,attack:5,exp:10,goldMin:4,goldMax:9,weight:20,lootTable:[{itemId:'wolfPelt',chance:.5},{itemId:'redPotion',chance:.08}]}};
const DEFAULT_PLAYER={name:'冒險者',level:1,exp:0,hp:30,maxHp:30,gold:10,baseAttack:2,location:'說話之島村莊',inventory:{},equipment:{weapon:'rustySword'}};
function migrateSave(){try{const v2=JSON.parse(localStorage.getItem('textRPGSaveV2')||'null');if(v2&&v2.version===SAVE_VERSION)return Object.assign({},DEFAULT_PLAYER,v2.player);const old=JSON.parse(localStorage.getItem('textRPGSave')||'null');if(old){return Object.assign({},DEFAULT_PLAYER,{name:old.name||'冒險者',level:old.level||1,hp:old.hp??30,maxHp:old.maxHp??30,gold:old.gold??10,location:old.location||'說話之島村莊'})}}catch(e){}return structuredClone(DEFAULT_PLAYER)}const player=migrateSave();let enemy=null;
const $=id=>document.getElementById(id),ui={app:$('app'),top:$('top'),story:$('story'),location:$('location'),level:$('level'),exp:$('exp'),hp:$('hp'),gold:$('gold'),hpfill:$('hpfill'),modeTitle:$('modeTitle'),enemyCard:$('enemyCard'),enemyName:$('enemyName'),enemyHp:$('enemyHp'),enemyfill:$('enemyfill'),command:$('command'),soundBtn:$('soundBtn')};
let soundOn=true,audioCtx=null,currentTrack=null,currentState='';const tracks={village:new Audio('audio/game-bgm/village.mp3'),field:new Audio('audio/game-bgm/wilderness.mp3'),battle:new Audio('audio/game-bgm/battle.mp3')};Object.values(tracks).forEach(a=>{a.loop=true;a.preload='auto';a.volume=.34});tracks.battle.volume=.42;function desiredMusic(){return enemy?'battle':player.location.includes('村莊')?'village':'field'}function syncMusic(){if(!soundOn)return;const s=desiredMusic();if(currentState===s&&currentTrack&&!currentTrack.paused)return;if(currentTrack){currentTrack.pause();currentTrack.currentTime=0}currentState=s;currentTrack=tracks[s];currentTrack.play().catch(()=>{})}function toggleSound(){soundOn=!soundOn;ui.soundBtn.textContent=soundOn?'🔊':'🔇';if(!soundOn&&currentTrack)currentTrack.pause();else syncMusic()}function ctx(){if(!soundOn)return null;try{if(!audioCtx){const A=window.AudioContext||window.webkitAudioContext;if(!A)return null;audioCtx=new A()}if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx}catch(e){return null}}function beep(f,d,v,type='square'){const c=ctx();if(!c)return;const o=c.createOscillator(),g=c.createGain(),t=c.currentTime;o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(c.destination);o.start();o.stop(t+d)}function hitSound(){beep(150,.07,.12);setTimeout(()=>beep(75,.08,.08,'triangle'),25)}function hurtSound(){beep(85,.12,.08,'sawtooth')}
function save(){localStorage.setItem('textRPGSaveV2',JSON.stringify({version:SAVE_VERSION,player}))}function nextExp(){return LEVEL_TABLE[player.level]?.nextExp}function itemName(id){return ITEMS[id]?.name||id}function msg(t,c='system'){const d=document.createElement('div');d.className='msg '+c;d.textContent=t;ui.story.appendChild(d);ui.story.scrollTop=ui.story.scrollHeight}function render(){ui.location.textContent=player.location;ui.level.textContent=player.level;ui.exp.textContent=nextExp()?`${player.exp}/${nextExp()}`:`${player.exp}/MAX`;ui.hp.textContent=`${player.hp}/${player.maxHp}`;ui.gold.textContent=player.gold;ui.hpfill.style.width=Math.max(0,player.hp/player.maxHp*100)+'%';ui.app.classList.toggle('combat',!!enemy);ui.modeTitle.textContent=enemy?'⚔️ 戰鬥':'亞丁文字冒險';if(enemy){ui.enemyName.textContent=`${enemy.name} Lv.${enemy.level}`;ui.enemyHp.textContent=`HP ${Math.max(0,enemy.hp)}/${enemy.maxHp}`;ui.enemyfill.style.width=Math.max(0,enemy.hp/enemy.maxHp*100)+'%'}save();if(currentTrack)syncMusic()}
function enableAudio(){ctx();syncMusic()}function showStatus(){enableAudio();const w=ITEMS[player.equipment.weapon];msg(`${player.name}\nLv.${player.level}  EXP ${player.exp}/${nextExp()||'MAX'}\nHP ${player.hp}/${player.maxHp}\n基礎攻擊 ${player.baseAttack}\n武器 ${w.name} (+${w.attack})\n金幣 ${player.gold}\n所在地：${player.location}`)}function showInventory(){enableAudio();const rows=Object.entries(player.inventory).filter(([,n])=>n>0).map(([id,n])=>`${itemName(id)} ×${n}`);msg('🎒 背包\n'+(rows.length?rows.join('\n'):'空無一物'))}function moveTo(d){enableAudio();if(enemy)return;if(player.location===d){msg('你已經在這裡了。');return}player.location=d;msg(d.includes('村莊')?'你沿著道路回到村莊。':'你離開村莊，走進說話之島野外。');render();syncMusic()}function rest(){enableAudio();if(player.location.includes('野外')){msg('野外並不安全。');return}player.hp=Math.min(player.maxHp,player.hp+10);msg('你休息了一會兒。');render()}
function createMonster(id){const m=MONSTERS[id];return {...m,maxHp:m.hp}}function observe(){enableAudio();if(enemy)return;if(player.location.includes('村莊')){msg('你環顧村莊：武器店、守衛，以及通往野外的道路。');return}enemy=createMonster('goblin');msg(`草叢猛然晃動，一隻${enemy.name}衝向你！`,'combat');render();syncMusic()}
function hitFx(d){hitSound();ui.enemyCard.classList.remove('enemyHit');void ui.enemyCard.offsetWidth;ui.enemyCard.classList.add('enemyHit');const p=document.createElement('div');p.className='damagePop';p.textContent='-'+d;ui.enemyCard.appendChild(p);setTimeout(()=>p.remove(),600)}function playerFx(){hurtSound();ui.top.classList.remove('playerHit');void ui.top.offsetWidth;ui.top.classList.add('playerHit')}function attack(){enableAudio();if(!enemy||player.hp<=0)return;const d=Math.floor(Math.random()*5)+3;enemy.hp-=d;hitFx(d);msg(`你對${enemy.name}造成 ${d} 點傷害。`,'combat');if(enemy.hp<=0){const n=enemy.name,r=Math.floor(Math.random()*8)+3;enemy=null;player.gold+=r;msg(`${n}倒下了。你獲得 ${r} 枚金幣。`,'combat');render();return}player.hp=Math.max(0,player.hp-enemy.attack);playerFx();msg(`${enemy.name}反擊，你受到 ${enemy.attack} 點傷害。`,'combat');render()}function flee(){enableAudio();if(!enemy)return;const n=enemy.name;enemy=null;msg(`你成功逃離${n}。`);render()}function sendCommand(){enableAudio();const c=ui.command.value.trim();if(!c)return;msg('> '+c,'player');ui.command.value='';if(c.includes('背包'))showInventory();else if(c.includes('狀態'))showStatus();else if(c.includes('野外'))moveTo('說話之島野外');else if(c.includes('村莊'))moveTo('說話之島村莊');else if(c.includes('觀察')||c.includes('看看'))observe();else msg('這個自由行動目前還沒有對應規則。')}ui.command.addEventListener('keydown',e=>{if(e.key==='Enter')sendCommand()});render();msg('GL-1 Data Foundation 已啟用。\n\n玩家、怪物、物品、等級與 Save v2 已資料化；目前戰鬥行為暫時維持原版，下一階段才啟用 EXP、三種怪物與掉寶。');</script></body></html>
