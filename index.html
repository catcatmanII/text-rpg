<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111318"><title>亞丁文字冒險</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;background:#0d0f13;color:#eee;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif}button,input{font:inherit}button{touch-action:manipulation}.app{height:100dvh;max-width:680px;margin:auto;display:flex;flex-direction:column;background:#111318;overflow:hidden}.top{padding:max(12px,env(safe-area-inset-top)) 16px 12px;background:#181b21;border-bottom:1px solid #2a2e37}.title{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:19px}.soundBtn{border:1px solid #343a45;background:#242830;color:#fff;border-radius:10px;width:42px;height:36px}.place{margin-top:5px;color:#aeb4c0;font-size:13px}.hud{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;margin-top:12px;font-size:13px}.hpbar,.bar{height:8px;background:#343944;border-radius:999px;overflow:hidden}.hpfill,.enemyfill{height:100%;background:#c94f55;transition:width .2s}.hudHp{display:grid;grid-template-columns:auto 1fr auto;gap:7px;align-items:center}.story{flex:1;overflow-y:auto;padding:16px 16px 24px}.msg{padding:12px 13px;margin-bottom:10px;background:#191c22;border:1px solid #252a33;border-radius:12px;line-height:1.65;white-space:pre-line}.msg.player{background:#162131;border-color:#233a57;color:#cfe5ff}.msg.combat{background:#26191b;border-color:#4b282c}.controls{background:#171a20;border-top:1px solid #292e37;padding:10px 12px calc(10px + env(safe-area-inset-bottom))}.actionGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.action{min-height:52px;border:1px solid #343a45;border-radius:12px;background:#242830;color:#f4f4f4;font-weight:700}.free{display:flex;gap:8px;margin-top:9px}.free input{min-width:0;flex:1;height:48px;border:1px solid #353b46;border-radius:12px;background:#0f1116;color:#fff;padding:0 13px;font-size:16px}.send{width:52px;border:0;border-radius:12px;background:#9a7b37;color:white;font-size:20px}.combatPanel{display:none;flex-direction:column;gap:10px}.app.combat .explorePanel{display:none}.app.combat .combatPanel{display:flex}.enemyCard{position:relative;padding:14px;border:1px solid #4a3033;border-radius:14px;background:#211719}.enemyHead{display:flex;justify-content:space-between;gap:12px;margin-bottom:8px}.enemyName{font-size:18px;font-weight:800}.enemyHpText{color:#f0b8bc}.combatActions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.attack{grid-column:1/-1;min-height:58px;background:#853d42;border:1px solid #a9585e;color:white;border-radius:13px;font-size:17px;font-weight:800}.combatBtn{min-height:52px;border:1px solid #3b414c;border-radius:12px;background:#252a32;color:#fff;font-weight:700}.combatBtn:disabled{opacity:.4}.retreat{color:#ffd4a5}.toast{font-size:12px;color:#9fa6b2;text-align:center}.dead .combatActions button{pointer-events:none;opacity:.35}.enemyHit{animation:enemyHit .2s ease-out}.playerHit{animation:playerHit .22s ease-out}.damagePop{position:absolute;right:18px;top:6px;font-size:27px;font-weight:900;color:#fff;pointer-events:none;animation:damagePop .55s ease-out forwards}@keyframes enemyHit{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px);background:#633136}55%{transform:translateX(6px)}}@keyframes playerHit{0%,100%{background:#181b21}40%{background:#5a292d}}@keyframes damagePop{0%{opacity:0;transform:scale(.7)}25%{opacity:1;transform:scale(1.2)}100%{opacity:0;transform:translateY(-28px)}}
</style></head><body>
<div class="app" id="app"><header class="top" id="top"><div class="title"><span id="modeTitle">亞丁文字冒險</span><button id="soundBtn" class="soundBtn" onclick="toggleSound()">🔊</button></div><div class="place">📍 <span id="location"></span></div><div class="hud"><div class="hudHp"><span>❤️</span><div class="hpbar"><div class="hpfill" id="hpfill"></div></div><span id="hp"></span></div><span>Lv.<b id="level"></b></span><span>💰 <b id="gold"></b></span></div></header><main class="story" id="story"></main><footer class="controls"><section class="explorePanel"><div class="actionGrid"><button class="action" onclick="observe()">👁️<br>觀察</button><button class="action" onclick="showInventory()">🎒<br>背包</button><button class="action" onclick="showStatus()">👤<br>狀態</button><button class="action" onclick="moveTo('說話之島村莊')">🏘️<br>村莊</button><button class="action" onclick="moveTo('說話之島野外')">🗺️<br>野外</button><button class="action" onclick="rest()">🔥<br>休息</button></div><div class="free"><input id="command" placeholder="想做其他事情……" autocomplete="off"><button class="send" onclick="sendCommand()">➤</button></div></section><section class="combatPanel"><div class="enemyCard" id="enemyCard"><div class="enemyHead"><span class="enemyName" id="enemyName">敵人</span><span class="enemyHpText" id="enemyHp"></span></div><div class="bar"><div class="enemyfill" id="enemyfill"></div></div></div><div class="combatActions"><button class="attack" onclick="attack()">⚔️ 普通攻擊</button><button class="combatBtn" disabled>✨ 技能<br><small>尚未開放</small></button><button class="combatBtn" onclick="showInventory()">🎒 道具</button><button class="combatBtn retreat" onclick="flee()">🏃 逃跑</button><button class="combatBtn" onclick="showStatus()">👤 狀態</button></div><div class="toast">戰鬥中直接點擊行動。</div></section></footer></div>
<script>
const defaults={name:"冒險者",level:1,hp:30,maxHp:30,gold:10,location:"說話之島村莊",inventory:["生鏽的短劍"]};const player={...defaults};let enemy=null;const $=id=>document.getElementById(id);const ui={app:$("app"),top:$("top"),story:$("story"),location:$("location"),level:$("level"),hp:$("hp"),gold:$("gold"),hpfill:$("hpfill"),modeTitle:$("modeTitle"),enemyCard:$("enemyCard"),enemyName:$("enemyName"),enemyHp:$("enemyHp"),enemyfill:$("enemyfill"),command:$("command"),soundBtn:$("soundBtn")};
let soundOn=true,audioCtx=null;function audio(){if(!soundOn)return null;try{if(!audioCtx){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return null;audioCtx=new AC()}if(audioCtx.state==="suspended")audioCtx.resume();return audioCtx}catch(e){return null}}function beep(freq,duration,volume,type="square"){const c=audio();if(!c)return;try{const o=c.createOscillator(),g=c.createGain(),t=c.currentTime;o.type=type;o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(volume,t);g.gain.exponentialRampToValueAtTime(.001,t+duration);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+duration)}catch(e){}}function hitSound(){beep(150,.07,.12,"square");setTimeout(()=>beep(75,.08,.08,"triangle"),25)}function hurtSound(){beep(85,.12,.08,"sawtooth")}function toggleSound(){soundOn=!soundOn;ui.soundBtn.textContent=soundOn?"🔊":"🔇";if(soundOn)audio()}
function addMessage(text,type="system"){const d=document.createElement("div");d.className=`msg ${type}`;d.textContent=text;ui.story.appendChild(d);ui.story.scrollTop=ui.story.scrollHeight}function save(){localStorage.setItem("textRPGSave",JSON.stringify(player))}function load(){try{Object.assign(player,JSON.parse(localStorage.getItem("textRPGSave"))||{})}catch(e){}}function render(){ui.location.textContent=player.location;ui.level.textContent=player.level;ui.hp.textContent=`${player.hp}/${player.maxHp}`;ui.gold.textContent=player.gold;ui.hpfill.style.width=`${Math.max(0,player.hp/player.maxHp*100)}%`;ui.app.classList.toggle("combat",!!enemy);ui.app.classList.toggle("dead",player.hp<=0);ui.modeTitle.textContent=enemy?"⚔️ 戰鬥":"亞丁文字冒險";if(enemy){ui.enemyName.textContent=enemy.name;ui.enemyHp.textContent=`HP ${Math.max(0,enemy.hp)}/${enemy.maxHp}`;ui.enemyfill.style.width=`${Math.max(0,enemy.hp/enemy.maxHp*100)}%`}save()}
function hitFeedback(dmg){hitSound();ui.enemyCard.classList.remove("enemyHit");void ui.enemyCard.offsetWidth;ui.enemyCard.classList.add("enemyHit");const p=document.createElement("div");p.className="damagePop";p.textContent=`-${dmg}`;ui.enemyCard.appendChild(p);setTimeout(()=>p.remove(),600);if(navigator.vibrate)navigator.vibrate(30)}function playerFeedback(){hurtSound();ui.top.classList.remove("playerHit");void ui.top.offsetWidth;ui.top.classList.add("playerHit");if(navigator.vibrate)navigator.vibrate(25)}
function showStatus(){addMessage(`${player.name}\nLv.${player.level}\nHP ${player.hp}/${player.maxHp}\n金幣 ${player.gold}\n所在地：${player.location}`)}function showInventory(){addMessage("🎒 背包\n"+(player.inventory.length?player.inventory.join("\n"):"空無一物"))}function moveTo(dest){if(enemy)return;if(player.location===dest){addMessage("你已經在這裡了。");return}player.location=dest;addMessage(dest.includes("村莊")?"你沿著道路回到村莊。商店與旅館就在前方。":"你離開村莊，走進說話之島野外。草叢裡不時傳出動靜。");render()}function rest(){if(player.location.includes("野外")){addMessage("野外並不安全，你決定暫時不要休息。");return}const old=player.hp;player.hp=Math.min(player.maxHp,player.hp+10);addMessage(`你休息了一會兒，恢復 ${player.hp-old} HP。`);render()}function observe(){if(enemy)return;if(player.location.includes("村莊")){addMessage("你環顧村莊：武器店老闆正在整理貨架，守衛站在出口旁，北方道路通往野外。");return}if(Math.random()<.65){enemy={name:"哥布林",hp:12,maxHp:12,attack:4};addMessage("草叢猛然晃動，一隻哥布林握著木棒衝向你！","combat");render()}else{const n=Math.floor(Math.random()*5)+1;player.gold+=n;addMessage(`你仔細搜索草地，找到 ${n} 枚金幣。`);render()}}
function attack(){audio();if(!enemy||player.hp<=0)return;const dmg=Math.floor(Math.random()*5)+3;enemy.hp-=dmg;hitFeedback(dmg);addMessage(`你揮動短劍，對${enemy.name}造成 ${dmg} 點傷害。`,"combat");if(enemy.hp<=0){const name=enemy.name,reward=Math.floor(Math.random()*8)+3;enemy=null;player.gold+=reward;addMessage(`${name}倒下了。你獲得 ${reward} 枚金幣。`,"combat");render();return}player.hp=Math.max(0,player.hp-enemy.attack);playerFeedback();addMessage(`${enemy.name}揮棒反擊，你受到 ${enemy.attack} 點傷害。`,"combat");if(player.hp<=0)addMessage("你失去力氣，倒在地上……","combat");render()}function flee(){if(!enemy)return;const name=enemy.name;enemy=null;addMessage(`你拉開距離，成功逃離${name}。`);render()}function sendCommand(){const cmd=ui.command.value.trim();if(!cmd)return;addMessage(`> ${cmd}`,"player");ui.command.value="";if(cmd.includes("背包"))showInventory();else if(cmd.includes("狀態"))showStatus();else if(cmd.includes("野外"))moveTo("說話之島野外");else if(cmd.includes("村莊"))moveTo("說話之島村莊");else if(cmd.includes("觀察")||cmd.includes("看看"))observe();else addMessage("這個自由行動目前還沒有對應規則；之後會交給 AI Intent Parser 理解。")}
ui.command.addEventListener("keydown",e=>{if(e.key==="Enter")sendCommand()});load();render();addMessage("海風吹過說話之島。\n\n你在村莊中醒來，身旁只有一把生鏽的短劍。\n\n常用行動直接使用下方按鈕；特殊行動仍可自由輸入。");
</script></body></html>
