<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>亞丁文字冒險</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;background:#0d0f13;color:#eee;font-family:system-ui,"Noto Sans TC",sans-serif}button{font:inherit}.app{height:100dvh;max-width:680px;margin:auto;display:flex;flex-direction:column;background:#111318;overflow:hidden}.top{padding:16px;background:#181b21;border-bottom:1px solid #2a2e37}.title{display:flex;justify-content:space-between;font-weight:800;font-size:19px}.sound,.btn,.row button{background:#242830;color:#fff;border:1px solid #343a45;border-radius:10px;padding:8px}.place{color:#aeb4c0;font-size:13px;margin-top:5px}.hud{display:grid;grid-template-columns:1fr auto auto;gap:8px;margin-top:12px;font-size:13px}.hpbar,.bar{height:8px;background:#343944;border-radius:9px;overflow:hidden}.hpfill,.enemyfill{height:100%;background:#c94f55}.story{flex:1;overflow-y:auto;padding:16px}.msg{padding:12px;margin-bottom:10px;background:#191c22;border:1px solid #252a33;border-radius:12px;line-height:1.6;white-space:pre-line}.good{background:#19291f}.combat{display:none}.in-combat .explore{display:none}.in-combat .combat{display:block}.controls{padding:10px 12px;background:#171a20;border-top:1px solid #292e37;padding-bottom:calc(10px + env(safe-area-inset-bottom))}.grid,.combatActions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.btn{min-height:50px;font-weight:700}.attack{grid-column:1/-1;background:#853d42}.combatCard{padding:14px;border:1px solid #4a3033;border-radius:14px;background:#211719}.combatHead{display:flex;justify-content:space-between;margin-bottom:8px}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end}.modal.open{display:flex}.sheet{width:min(680px,100%);max-height:75%;overflow:auto;background:#191c22;padding:18px;border-radius:18px 18px 0 0}.row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #30343d}.muted{color:#aeb4c0;font-size:13px}</style></head><body><div class="app" id="app"><header class="top"><div class="title"><span id="title">亞丁文字冒險</span><button class="sound" id="sound" onclick="toggleSound()">🔊</button></div><div class="place">📍 <span id="location"></span></div><div class="hud"><span>❤️ <b id="hp"></b><div class="hpbar"><div class="hpfill" id="hpfill"></div></div></span><span>Lv.<b id="level"></b> · EXP <b id="exp"></b></span><span>💰 <b id="gold"></b></span></div></header><main class="story" id="story"></main><footer class="controls"><section class="explore"><div class="grid"><button class="btn" onclick="observe()">👁️<br>觀察</button><button class="btn" onclick="inventory(false)">🎒<br>背包</button><button class="btn" onclick="status()">👤<br>角色</button><button class="btn" onclick="village()">🏘️<br>村莊服務</button><button class="btn" onclick="move('說話之島野外')">🗺️<br>出村</button><button class="btn" onclick="inn()">🏨<br>旅館</button></div></section><section class="combat"><div class="combatCard"><div class="combatHead"><b id="enemyName"></b><span id="enemyHp"></span></div><div class="bar"><div class="enemyfill" id="enemyfill"></div></div></div><div class="combatActions"><button class="btn attack" onclick="attack()">⚔️ 普通攻擊</button><button class="btn" disabled>✨ 技能</button><button class="btn" onclick="inventory(true)">🎒 道具</button><button class="btn" onclick="flee()">🏃 逃跑</button><button class="btn" onclick="status()">👤 狀態</button></div></section></footer></div><div class="modal" id="modal"><div class="sheet"><div class="title"><span id="sheetTitle"></span><button class="sound" onclick="closeModal()">✕</button></div><div id="sheetBody"></div></div></div><script>
const SAVE_VERSION=2,LEVEL_TABLE={1:{next:20,hp:30,atk:2},2:{next:50,hp:36,atk:3},3:{next:90,hp:42,atk:4},4:{next:140,hp:48,atk:5},5:{next:null,hp:55,atk:6}};
const ITEMS={rustySword:{name:'生鏽的短劍',type:'WEAPON',attack:2,value:2},ironSword:{name:'鐵劍',type:'WEAPON',attack:5,value:25},redPotion:{name:'紅色藥水',type:'CONSUMABLE',heal:15,value:5},slimeGel:{name:'史萊姆黏液',type:'MATERIAL',value:2},goblinTooth:{name:'哥布林牙齒',type:'MATERIAL',value:3},wolfPelt:{name:'狼皮',type:'MATERIAL',value:5}};
const MONSTERS={slime:{name:'史萊姆',level:1,hp:8,attack:2,exp:4,gold:[1,3],weight:40,loot:[['slimeGel',.6],['redPotion',.05]]},goblin:{name:'哥布林',level:1,hp:12,attack:4,exp:7,gold:[3,7],weight:40,loot:[['goblinTooth',.45],['redPotion',.1]]},wolf:{name:'野狼',level:2,hp:18,attack:5,exp:10,gold:[4,9],weight:20,loot:[['wolfPelt',.5],['redPotion',.08]]}};
const DEFAULT={name:'冒險者',level:1,exp:0,hp:30,maxHp:30,gold:10,baseAttack:2,location:'說話之島村莊',inventory:{},equipment:{weapon:'rustySword'}};function load(){try{let s=JSON.parse(localStorage.getItem('textRPGSaveV2'));if(s&&s.version===2)return {...DEFAULT,...s.player,equipment:{...DEFAULT.equipment,...s.player.equipment},inventory:{...s.player.inventory}}}catch(e){}return structuredClone(DEFAULT)}const player=load();let enemy=null;
function save(){localStorage.setItem('textRPGSaveV2',JSON.stringify({version:SAVE_VERSION,player}))}function item(id){return ITEMS[id]}function weapon(){return item(player.equipment.weapon)}function next(){return LEVEL_TABLE[player.level]?.next}function add(id,n=1){player.inventory[id]=(player.inventory[id]||0)+n}function take(id,n=1){player.inventory[id]=Math.max(0,(player.inventory[id]||0)-n)}function msg(t,c=''){let d=document.createElement('div');d.className='msg '+c;d.textContent=t;story.appendChild(d);story.scrollTop=story.scrollHeight}function render(){location.textContent=player.location;level.textContent=player.level;exp.textContent=next()?`${player.exp}/${next()}`:`${player.exp}/MAX`;hp.textContent=`${player.hp}/${player.maxHp}`;gold.textContent=player.gold;hpfill.style.width=Math.max(0,player.hp/player.maxHp*100)+'%';app.classList.toggle('in-combat',!!enemy);title.textContent=enemy?'⚔️ 戰鬥':'亞丁文字冒險';if(enemy){enemyName.textContent=`${enemy.name} Lv.${enemy.level}`;enemyHp.textContent=`HP ${enemy.hp}/${enemy.maxHp}`;enemyfill.style.width=Math.max(0,enemy.hp/enemy.maxHp*100)+'%'}save();music()}function move(to){if(enemy)return;if(player.location===to)return msg('你已經在這裡了。');player.location=to;msg(to.includes('村莊')?'你回到說話之島村莊。':'你離開村莊，進入野外。');render()}function observe(){if(enemy)return;if(player.location.includes('村莊'))return msg('村莊裡有武器店、道具店與旅館。');let r=Math.random()*100,id='slime';for(const [k,m] of Object.entries(MONSTERS)){r-=m.weight;if(r<=0){id=k;break}}let m=MONSTERS[id];enemy={...m,maxHp:m.hp};msg(`草叢晃動，一隻${enemy.name}出現了！`,'combat');render()}function attack(){if(!enemy)return;let d=player.baseAttack+weapon().attack+Math.floor(Math.random()*3);enemy.hp-=d;msg(`你使用${weapon().name}造成 ${d} 點傷害。`,'combat');if(enemy.hp<=0)return victory();counter()}function counter(){player.hp=Math.max(0,player.hp-enemy.attack);msg(`${enemy.name}反擊，你受到 ${enemy.attack} 點傷害。`,'combat');if(player.hp<=0)death();render()}function victory(){let m=enemy,n=enemy.name,g=m.gold[0]+Math.floor(Math.random()*(m.gold[1]-m.gold[0]+1));enemy=null;player.exp+=m.exp;player.gold+=g;let drops=[];for(const [id,chance] of m.loot)if(Math.random()<chance){add(id);drops.push(item(id).name)}msg(`${n}倒下了！獲得 EXP ${m.exp}、${g} 金幣${drops.length?'、掉落：'+drops.join('、'):''}`,'good');while(next()&&player.exp>=next()){player.level++;let t=LEVEL_TABLE[player.level];player.maxHp=t.hp;player.baseAttack=t.atk;player.hp=t.hp;msg(`🎉 升級！你達到 Lv.${player.level}。HP 與攻擊力提升。`,'good')}render()}function flee(){if(!enemy)return;msg(`你逃離了${enemy.name}。`);enemy=null;render()}function death(){enemy=null;player.location='說話之島村莊';player.hp=Math.ceil(player.maxHp*.5);msg('你失去了意識。\n醒來時，你已躺在說話之島村莊的旅館裡。\nHP 恢復 50%，沒有損失金幣、EXP 或物品。','combat')}
function open(t,h){sheetTitle.textContent=t;sheetBody.innerHTML=h;modal.classList.add('open')}function closeModal(){modal.classList.remove('open')}function status(){let w=weapon();open('角色',`<p>Lv.${player.level}　EXP ${player.exp}/${next()||'MAX'}</p><p>HP ${player.hp}/${player.maxHp}<br>基礎攻擊 ${player.baseAttack}<br>武器：${w.name} (+${w.attack})<br>金幣：${player.gold}</p>`)}function inventory(combat){let h=Object.entries(player.inventory).filter(([,n])=>n>0).map(([id,n])=>{let x=item(id),a=x.type==='CONSUMABLE'?`<button onclick="usePotion(${combat})">使用</button>`:x.type==='WEAPON'?`<button onclick="equip('${id}')">裝備</button>`:'';return `<div class="row"><span>${x.name} ×${n}<br><small class="muted">${x.type==='CONSUMABLE'?'恢復 '+x.heal+' HP':x.type==='WEAPON'?'ATK +'+x.attack:'可出售 '+x.value+' G'}</small></span>${a}</div>`}).join('');open('🎒 背包',h||'<p>空無一物</p>')}function equip(id){player.equipment.weapon=id;closeModal();msg(`你裝備了${item(id).name}。`,'good');render()}function usePotion(combat){if(!player.inventory.redPotion)return msg('你沒有紅色藥水。');if(player.hp>=player.maxHp)return msg('HP 已經全滿。');take('redPotion');let h=Math.min(15,player.maxHp-player.hp);player.hp+=h;closeModal();msg(`你喝下紅色藥水，恢復 ${h} HP。`,'good');if(combat)counter();render()}function village(){if(!player.location.includes('村莊'))return msg('只有回到村莊才能使用服務。');open('說話之島村莊',`<div class="row"><span>⚔️ 武器店<br><small class="muted">鐵劍 · ATK +5 · 50 G</small></span><button onclick="buy('ironSword',50)">購買</button></div><div class="row"><span>🧪 道具店<br><small class="muted">紅色藥水 · 恢復 15 HP · 10 G</small></span><button onclick="buy('redPotion',10)">購買</button></div><div class="row"><span>💰 材料商人<br><small class="muted">出售全部材料</small></span><button onclick="sellAll()">出售</button></div>`)}function buy(id,c){if(player.gold<c)return msg('金幣不足。');player.gold-=c;add(id);closeModal();msg(`你購買了${item(id).name}。`,'good');render()}function sellAll(){let total=0;for(const [id,n] of Object.entries(player.inventory))if(item(id).type==='MATERIAL'){total+=item(id).value*n;player.inventory[id]=0}if(!total)return msg('沒有可出售的材料。');player.gold+=total;closeModal();msg(`你出售材料，獲得 ${total} 金幣。`,'good');render()}function inn(){if(!player.location.includes('村莊'))return msg('野外沒有旅館。');if(player.gold<5)return msg('金幣不足，旅館住宿需要 5 金幣。');player.gold-=5;player.hp=player.maxHp;msg('你在旅館休息，HP 完全恢復。','good');render()}
let soundOn=true,current=null;const tracks={village:new Audio('audio/game-bgm/village.mp3'),field:new Audio('audio/game-bgm/wilderness.mp3'),battle:new Audio('audio/game-bgm/battle.mp3')};Object.values(tracks).forEach(a=>{a.loop=true;a.volume=.34});function music(){if(!soundOn)return;let s=enemy?'battle':player.location.includes('村莊')?'village':'field',a=tracks[s];if(current===a&&!a.paused)return;if(current){current.pause();current.currentTime=0}current=a;a.play().catch(()=>{})}function toggleSound(){soundOn=!soundOn;sound.textContent=soundOn?'🔊':'🔇';if(soundOn)music();else if(current)current.pause()}render();msg('GL-2～GL-5 已啟用：戰鬥、升級、掉寶、背包、商店、旅館與死亡復活。點擊「觀察」開始探索。');</script><script src="absurd-events-arc.js"></script></body></html>
